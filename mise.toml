[tools]
go = "1.27.1"
node = "22.20.0"
lefthook = "2.2.2"
sqlc = "1.31.1"

[tasks."web:install"]
dir = "apps/analyst-web"
run = "npm ci"

[tasks."analyst-web:dev"]
description = "Start the Next.js development server on the host"
dir = "apps/analyst-web"
run = "node ../../scripts/orchestration-env.mjs node ../../scripts/analyst-web-dev.mjs"

[tasks."db:generate"]
dir = "apps/reconciliation"
run = "sqlc generate"

[tasks."check:go"]
dir = "apps/reconciliation"
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
  exit 1
fi
go vet ./...
'''

[tasks."check:web"]
dir = "apps/analyst-web"
run = "npm run check"

[tasks.check]
depends = ["check:go", "check:web"]

[tasks."build:go"]
dir = "apps/reconciliation"
run = "go build ./..."

[tasks."build:web"]
dir = "apps/analyst-web"
run = "npm run build"

[tasks.build]
depends = ["build:go", "build:web"]

[tasks.test]
dir = "apps/reconciliation"
run = "go test ./..."

[tasks."browser:install"]
dir = "apps/analyst-web"
run = "npm exec -- playwright install --with-deps chromium"

[tasks.smoke]
run = "sh scripts/smoke.sh"

[tasks."env:init"]
description = "Create missing environment files from their examples"
run = "node scripts/env-init.mjs"

[tasks."compose:up"]
description = "Build and start the worktree's Compose stack"
run = "node scripts/orchestration-env.mjs node scripts/compose-env.mjs sh scripts/compose.sh up --build -d --wait"

[tasks."compose:logs"]
description = "Show logs from the worktree's Compose stack"
run = "node scripts/orchestration-env.mjs sh scripts/compose.sh logs"

[tasks."compose:stop"]
description = "Stop the worktree's Compose stack and keep PostgreSQL data"
run = "node scripts/orchestration-env.mjs sh scripts/compose.sh down"
