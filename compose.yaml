x-go: &go
  build: ./apps/reconciliation
  image: ${COMPOSE_PROJECT_NAME:-reconcilio}-go:local
  environment: &go-env
    DATABASE_URL: ${DATABASE_URL:-postgres://reconcilio:reconcilio@postgres:5432/reconcilio?sslmode=disable}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reconcilio}
      POSTGRES_USER: ${POSTGRES_USER:-reconcilio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconcilio}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *go
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *go
    environment:
      <<: *go-env
      JWT_SECRET: ${JWT_SECRET:-}
      RECONCILIO_API_ENABLED: ${RECONCILIO_API_ENABLED:-true}
      RECONCILIO_WORKER_ENABLED: ${RECONCILIO_WORKER_ENABLED:-true}
      RECONCILIO_TRACE_STDOUT: ${RECONCILIO_TRACE_STDOUT:-false}
      RECONCILIO_METRIC_STDOUT: ${RECONCILIO_METRIC_STDOUT:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_RESPONSES_URL: ${OPENAI_RESPONSES_URL:-}
      RECONCILIO_AI_PER_JOB_LIMIT: ${RECONCILIO_AI_PER_JOB_LIMIT:-5}
      RECONCILIO_AI_DAILY_LIMIT: ${RECONCILIO_AI_DAILY_LIMIT:-50}
    ports:
      - "127.0.0.1:${RECONCILIATION_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  analyst-web:
    build: ./apps/analyst-web
    environment:
      BACKEND_API_ORIGIN: ${BACKEND_API_ORIGIN:-http://backend:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${ANALYST_WEB_PORT:-3000}}
    ports:
      - "127.0.0.1:${ANALYST_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 4s
      retries: 15

volumes:
  postgres-data:
