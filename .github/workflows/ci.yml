name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run web:install
      - run: mise run check
      - run: mise run build
      - run: mise run test
      - run: mise run browser:install
      - run: mise run smoke
      - run: RECONCILIO_SMOKE_RANKING=true mise run smoke
